apiVersion: v1
kind: PersistentVolume
metadata:
  name: ha-persistent-volume-1
spec:
  capacity:
    storage: 300Mi
  accessModes:
    - ReadWriteOnce
  csi:
    driver: pd.csi.storage.gke.io
    volumeHandle: projects/ha-persistent-volume-1
  persistentVolumeReclaimPolicy: Delete
  storageClassName: standard-rwo
  volumeMode: Filesystem
